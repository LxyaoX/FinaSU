name: ShellCheck

on:
  push:
    branches:
      - 'main'
      - 'master'
      - 'dev'
    paths:
      - '.github/workflows/shellcheck.yml'
      - '**/*.sh'
      # Payload scripts carried for the device. They run under busybox ash, where
      # `local` and `[[ ]]` are builtins and the helper next to them is on the
      # source path; shellcheck measures them against strict POSIX sh and cannot
      # be told otherwise without a shebang the device would not accept.
      - '!userspace/ksud/bin/**'
  pull_request:
    branches:
      - 'main'
      - 'master'
      - 'dev'
    paths:
      - '.github/workflows/shellcheck.yml'
      - '**/*.sh'
      - '!userspace/ksud/bin/**'

jobs:
  shellcheck:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          ignore_names: gradlew
          # installer.sh keeps upstream content byte for byte; its scripts run
          # on the device, not in CI.
          ignore_paths: ./userspace/ksud/src/installer.sh ./.github/scripts/setup-rust-build.sh

name: Build ksud
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      pack_lkm:
        required: false
        type: boolean
        default: false
      pack_ksuinit:
        required: false
        type: boolean
        default: false
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Download artifacts
      uses: actions/download-artifact@v8
    
    - name: Prepare LKM files
      if: ${{ inputs.pack_lkm }}
      run: |
        cp aarch64-android*-lkm/*_kernelsu.ko ./userspace/ksud/bin/aarch64/
        cp aarch64-android*-lkm/*_nomount.ko ./userspace/ksud/bin/aarch64/
        cp x86_64-android*-lkm/*_kernelsu.ko ./userspace/ksud/bin/x86_64/
        cp x86_64-android*-lkm/*_nomount.ko ./userspace/ksud/bin/x86_64/

        # Every architecture that ships modules needs one of each kind. Check it
        # here: a missing artifact otherwise ships silently and only shows up as a
        # dead NoMount page on the affected devices.
        for bindir in aarch64 x86_64; do
          kernelsu=$(find "userspace/ksud/bin/$bindir" -name '*_kernelsu.ko' | wc -l)
          nomount=$(find "userspace/ksud/bin/$bindir" -name '*_nomount.ko' | wc -l)
          echo "$bindir: $kernelsu kernelsu.ko, $nomount nomount.ko"
          test "$kernelsu" -gt 0
          test "$kernelsu" -eq "$nomount"
        done

    - name: Prepare ksuinit
      if: ${{ inputs.pack_ksuinit }}
      run: |
        mv ksuinit-aarch64/ksuinit ./userspace/ksud/bin/aarch64/
        mv ksuinit-x86_64/ksuinit ./userspace/ksud/bin/x86_64/
        mv ksuinit-riscv64/ksuinit ./userspace/ksud/bin/riscv64/

    # Sui ships as a payload embedded in ksud, so the package has to carry it for
    # every ABI upstream still publishes one for. riscv64 has no Sui payload, and
    # the manager reports "payload missing" there instead of failing.
    - name: Stage the Sui payload
      if: ${{ inputs.target != 'riscv64-linux-android' }}
      run: |
        case "${{ inputs.target }}" in
          aarch64-linux-android) bindir=aarch64 ;;
          x86_64-linux-android) bindir=x86_64 ;;
          *) echo "unexpected target: ${{ inputs.target }}" >&2; exit 1 ;;
        esac

        zip=$(ls -t sui-payload/*.zip | head -1)
        version=$(sed -n 's/^version=//p' userspace/sui/payload-version.txt)
        version_code=$(sed -n 's/^version_code=//p' userspace/sui/payload-version.txt)

        python3 userspace/sui/package.py \
          --zip "$zip" \
          --target "$bindir" \
          --assets "userspace/ksud/bin/$bindir" \
          --version "$version" \
          --version-code "$version_code" \
          --force

        test -f "userspace/ksud/bin/$bindir/sui/payload.json"

    - name: Setup rustup
      run: |
        if [ "${{ inputs.target }}" = riscv64-linux-android ]; then
          rustup toolchain install nightly-2026-09-23 --profile minimal --component rust-src
        else
          rustup update stable
          rustup target add ${{ inputs.target }}
        fi

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: userspace/ksud
        cache-targets: false

    - uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r29

    - name: Build and package FolkZygisk
      if: ${{ inputs.target != 'riscv64-linux-android' }}
      env:
        NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: |
        case "${{ inputs.target }}" in
          aarch64-linux-android) archs="arm64-v8a armeabi-v7a"; assets=aarch64 ;;
          x86_64-linux-android) archs="x86_64 x86"; assets=x86_64 ;;
          *) exit 1 ;;
        esac
        make -C userspace/folkzygisk BUILD_TYPE=release ARCHS="$archs" NDK_PATH="$NDK_PATH"
        python3 userspace/folkzygisk/package.py --stage userspace/folkzygisk/build/stage/release --assets "userspace/ksud/bin/$assets" --target "$assets"

    - name: Archive matching FolkZygisk source
      if: ${{ inputs.target != 'riscv64-linux-android' }}
      run: git archive --format=tar.gz --output=folkzygisk-source-${{ inputs.target }}.tar.gz HEAD

    - name: Upload FolkZygisk source
      if: ${{ inputs.target != 'riscv64-linux-android' }}
      uses: actions/upload-artifact@v7
      with:
        name: folkzygisk-source-${{ inputs.target }}
        path: folkzygisk-source-${{ inputs.target }}.tar.gz

    - name: Build ksud
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          export KSU_PACKAGE_NAME="me.yuki.fina.pr"
        fi
        if [ "${{ inputs.target }}" = riscv64-linux-android ]; then
          source .github/scripts/setup-rust-build.sh riscv64-linux-android 35
          cargo +nightly-2026-09-23 build --config .github/riscv64-cargo.toml -Z build-std=std,panic_abort --target "$TRIPLE" --release --manifest-path ./userspace/ksud/Cargo.toml
        else
          source .github/scripts/setup-rust-build.sh ${{ inputs.target }} 26
          cargo build --target "$TRIPLE" --release --manifest-path ./userspace/ksud/Cargo.toml
        fi

    - name: Upload ksud artifact
      uses: actions/upload-artifact@v7
      with:
        name: ksud-${{ inputs.target }}
        path: target/${{ inputs.target }}/release/ksud

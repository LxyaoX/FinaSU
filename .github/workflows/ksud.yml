name: Build ksud
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      pack_lkm:
        required: false
        type: boolean
        default: false
      pack_ksuinit:
        required: false
        type: boolean
        default: false
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Download artifacts
      uses: actions/download-artifact@v8
    
    - name: Prepare LKM files
      if: ${{ inputs.pack_lkm }}
      run: |
        cp aarch64-android*-lkm/*_kernelsu.ko ./userspace/ksud/bin/aarch64/
        cp aarch64-android*-lkm/*_nomount.ko ./userspace/ksud/bin/aarch64/

        # arm64 is the only Android ABI this project ships, so a missing artifact
        # here would silently disable LKM updates (and NoMount) on every device.
        kernelsu=$(find userspace/ksud/bin/aarch64 -name '*_kernelsu.ko' | wc -l)
        nomount=$(find userspace/ksud/bin/aarch64 -name '*_nomount.ko' | wc -l)
        echo "aarch64: $kernelsu kernelsu.ko, $nomount nomount.ko"
        test "$kernelsu" -gt 0
        test "$kernelsu" -eq "$nomount"

    - name: Prepare ksuinit
      if: ${{ inputs.pack_ksuinit }}
      run: |
        mv ksuinit-aarch64/ksuinit ./userspace/ksud/bin/aarch64/

    - name: Setup rustup
      run: |
        if [ "${{ inputs.target }}" = riscv64-linux-android ]; then
          rustup toolchain install nightly-2026-09-23 --profile minimal --component rust-src
        else
          rustup update stable
          rustup target add ${{ inputs.target }}
        fi

    # Targets are cached too: without them every run rebuilds the whole dependency
    # graph, which is the longest single step of the pipeline.
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: userspace/ksud
        cache-targets: true

    - uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r29

    - name: Build YukiZygisk
      if: ${{ inputs.target == 'aarch64-linux-android' }}
      env:
        NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: |
        set -euo pipefail
        # The run log needs admin rights to download; annotations do not. Mirror the
        # step's own output to a file so a failure can be reported line by line.
        LOG=/tmp/yukizygisk-build.log
        exec > >(tee "$LOG") 2>&1
        TC="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
        export AR="$TC/bin/llvm-ar" RANLIB="$TC/bin/llvm-ranlib" STRIP="$TC/bin/llvm-strip"

        # build <source dir> <abi> <build dir>. The NDK's own toolchain file picks the
        # compiler, so the per-API triple names never have to be spelled out here.
        build() {
          cmake -S "$1" -B "$3" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$2" \
            -DANDROID_PLATFORM=android-31 \
            -DCMAKE_BUILD_TYPE=Release \
            -DYUKISU_ENABLE_CLANG_TIDY=OFF
          cmake --build "$3" --parallel
        }

        CORE=userspace/zygisk/core
        DAEMON=userspace/zygisk/daemon
        build "$CORE" arm64-v8a "$CORE/build"
        build "$CORE" armeabi-v7a "$CORE/build-armv7"
        build "$DAEMON" arm64-v8a "$DAEMON/build"
        build "$DAEMON" armeabi-v7a "$DAEMON/build-armv7"

        OUT=userspace/ksud/bin/aarch64/yukizygisk
        rm -rf "$OUT"
        mkdir -p "$OUT"
        cp "$DAEMON/build/zygiskd64" "$DAEMON/build-armv7/zygiskd32" \
           "$CORE/build/libzygisk64.so" "$CORE/build-armv7/libzygisk32.so" \
           "$CORE/build/libyukilinker64.so" "$CORE/build-armv7/libyukilinker32.so" \
           "$CORE/build/libyukizncore64.so" "$CORE/build-armv7/libyukizncore32.so" "$OUT/"
        for asset in zygiskd64 zygiskd32 libzygisk64.so libzygisk32.so \
          libyukilinker64.so libyukilinker32.so libyukizncore64.so libyukizncore32.so; do
          test -s "$OUT/$asset"
        done
        ls -l "$OUT"

    - name: Report YukiZygisk build errors
      if: failure() && inputs.target == 'aarch64-linux-android'
      shell: bash
      run: |
        set +e
        LOG=/tmp/yukizygisk-build.log
        if [ ! -s "$LOG" ]; then
          echo "::error title=YukiZygisk::no build log captured"
          exit 0
        fi
        plain=/tmp/yukizygisk-build.plain.log
        sed -r 's/\x1b\[[0-9;]*[A-Za-z]//g' "$LOG" > "$plain"
        matches=$(grep -iE 'error|fatal|CMake Error|not found|No such file|undefined reference' "$plain" | head -n 40)
        if [ -z "$matches" ]; then
          matches=$(tail -n 30 "$plain")
        fi
        printf '%s\n' "$matches" | while IFS= read -r line; do
          echo "::error title=YukiZygisk::${line}"
        done
        exit 0

    - name: Build ksud
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: |
        LOG=/tmp/ksud-build.log
        exec > >(tee "$LOG") 2>&1
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          export KSU_PACKAGE_NAME="me.yuki.fina.pr"
        fi
        if [ "${{ inputs.target }}" = riscv64-linux-android ]; then
          source .github/scripts/setup-rust-build.sh riscv64-linux-android 35
          cargo +nightly-2026-09-23 build --config .github/riscv64-cargo.toml -Z build-std=std,panic_abort --target "$TRIPLE" --release --manifest-path ./userspace/ksud/Cargo.toml
        else
          source .github/scripts/setup-rust-build.sh ${{ inputs.target }} 26
          cargo build --target "$TRIPLE" --release --manifest-path ./userspace/ksud/Cargo.toml
        fi

    - name: Report ksud build errors
      if: failure() && inputs.target != 'riscv64-linux-android'
      shell: bash
      run: |
        set +e
        LOG=/tmp/ksud-build.log
        if [ ! -s "$LOG" ]; then
          echo "::error title=ksud::no build log captured"
          exit 0
        fi
        plain=/tmp/ksud-build.plain.log
        sed -r 's/\x1b\[[0-9;]*[A-Za-z]//g' "$LOG" > "$plain"
        matches=$(grep -E '^error(\[|:)|^  --> |^ *[0-9]+ \| ' "$plain" | head -n 40)
        if [ -z "$matches" ]; then
          matches=$(tail -n 30 "$plain")
        fi
        printf '%s\n' "$matches" | while IFS= read -r line; do
          echo "::error title=ksud::${line}"
        done
        exit 0

    - name: Upload ksud artifact
      uses: actions/upload-artifact@v7
      with:
        name: ksud-${{ inputs.target }}
        path: target/${{ inputs.target }}/release/ksud

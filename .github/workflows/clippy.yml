name: Clippy check

on:
  push:
    branches:
      - main
      - master
      - dev
    paths:
      - '.github/workflows/clippy.yml'
      - 'userspace/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - '.github/scripts/setup-rust-build.sh'
  pull_request:
    branches:
      - main
      - master
      - dev
    paths:
      - '.github/workflows/clippy.yml'
      - 'userspace/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - '.github/scripts/setup-rust-build.sh'

env:
  RUSTFLAGS: '-Dwarnings'

jobs:
  clippy:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - run: rustup update stable
      
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: userspace/ksud

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Run clippy
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          LOG=/tmp/clippy.log
          exec > >(tee "$LOG") 2>&1
          rustup target add aarch64-linux-android
          source .github/scripts/setup-rust-build.sh aarch64-linux-android 26
          cargo clippy --target aarch64-linux-android --release

      - name: Report clippy findings
        if: failure()
        shell: bash
        run: |
          # The run log needs admin rights to download; annotations do not.
          set +e
          LOG=/tmp/clippy.log
          if [ ! -s "$LOG" ]; then
            echo "::error title=Clippy::no log captured"
            exit 0
          fi
          plain=/tmp/clippy.plain.log
          sed -r 's/\x1b\[[0-9;]*[A-Za-z]//g' "$LOG" > "$plain"
          matches=$(grep -E '^(error|warning)(\[|:)|^ *--> ' "$plain" | head -n 40)
          if [ -z "$matches" ]; then
            matches=$(tail -n 30 "$plain")
          fi
          printf '%s\n' "$matches" | while IFS= read -r line; do
            echo "::error title=Clippy::${line}"
          done
          exit 0

name: Build KernelSU Kernel Module

on:
  workflow_call:
    inputs:
      kmi:
        description: 'KMI version'
        required: true
        type: string
      ddk_release:
        description: 'DDK release version'
        required: false
        default: '20260828'
        type: string
      expected_size2:
        description: 'Second expected signature size (for PR builds)'
        required: false
        default: ''
        type: string
      expected_hash2:
        description: 'Second expected signature hash (for PR builds)'
        required: false
        default: ''
        type: string
      second_signature_release:
        description: 'Set to 1 when the second signature slot holds a release key instead of a PR key'
        required: false
        default: ''
        type: string

jobs:
  build-kernelsu-ko:
    name: Build kernelsu.ko for ${{ inputs.kmi }}
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/ylarod/ddk-min:${{ inputs.kmi }}-${{ inputs.ddk_release }}
      options: --privileged

    steps:
    - name: Checkout source code
      uses: actions/checkout@v7
      with:
        # The version stamp below counts commits, so a shallow clone would
        # report one commit instead of the real history.
        fetch-depth: 0

    - name: Build kernelsu.ko
      env:
        EXPECTED_SIZE2: ${{ inputs.expected_size2 }}
        EXPECTED_HASH2: ${{ inputs.expected_hash2 }}
        SECOND_SIGNATURE_RELEASE: ${{ inputs.second_signature_release }}
      run: |
        # The container runs as a different user than the workspace owner, so git
        # refuses to read the repository until this path is marked safe. It has to
        # be the actual workspace path, which differs per repository.
        git config --global --add safe.directory "$GITHUB_WORKSPACE"

        set -o pipefail
        KERNEL_LOG=/tmp/ksu-kernel-build.log
        : > "$KERNEL_LOG"

        cd kernel

        echo "=== Building kernelsu.ko for KMI: ${{ inputs.kmi }} ==="

        EXTRA_ARGS=""
        if [ -n "$EXPECTED_SIZE2" ] && [ -z "$EXPECTED_HASH2" ]; then
          echo "ERROR: expected_hash2 must be provided when expected_size2 is set."
          exit 1
        fi
        if [ -z "$EXPECTED_SIZE2" ] && [ -n "$EXPECTED_HASH2" ]; then
          echo "ERROR: expected_size2 must be provided when expected_hash2 is set."
          exit 1
        fi
        if [ -n "$EXPECTED_SIZE2" ]; then
          EXTRA_ARGS="KSU_EXPECTED_SIZE2=$EXPECTED_SIZE2 KSU_EXPECTED_HASH2=$EXPECTED_HASH2"
        fi
        if [ -n "$SECOND_SIGNATURE_RELEASE" ]; then
          EXTRA_ARGS="$EXTRA_ARGS KSU_SECOND_SIGNATURE_RELEASE=1"
        fi
        CONFIG_KSU=m CC=clang make KSU_REQUIRE_PREINIT=1 $EXTRA_ARGS 2>&1 | tee -a "$KERNEL_LOG"
        
        echo "=== Build completed ==="

        # Create output directory in GitHub workspace
        OUT_DIR=/github/workspace/out/aarch64
        mkdir -p $OUT_DIR

        # Copy with KMI-specific naming
        OUTPUT_NAME="${{ inputs.kmi }}_kernelsu.ko"
        cp kernelsu.ko "$OUT_DIR/$OUTPUT_NAME"
        
        echo "Copied to: $OUT_DIR/$OUTPUT_NAME"
        ls -la "$OUT_DIR/$OUTPUT_NAME"
        echo "Size: $(du -h "$OUT_DIR/$OUTPUT_NAME" | cut -f1)"
        llvm-strip -d "$OUT_DIR/$OUTPUT_NAME"
        echo "Size after stripping: $(du -h "$OUT_DIR/$OUTPUT_NAME" | cut -f1)"

    - name: Report build errors
      if: failure()
      shell: bash
      run: |
        # The run log needs admin rights to download; annotations of a public
        # repository do not. Repeat the compiler's own error lines as annotations so
        # a failed kernel build is readable from the API. Never fail this step: its
        # only job is to make the failure above legible.
        set +e
        KERNEL_LOG=/tmp/ksu-kernel-build.log
        if [ ! -s "$KERNEL_LOG" ]; then
          echo "::error title=Build::no kernel log captured"
          exit 0
        fi
        # make prints with colour on a TTY, so the literal "error:" is preceded by an
        # escape sequence; strip it before matching or every failure looks silent.
        plain=/tmp/ksu-kernel-build.plain.log
        sed -r 's/\x1b\[[0-9;]*[A-Za-z]//g' "$KERNEL_LOG" > "$plain"
        matches=$(grep -iE 'error:|undefined|modpost|not found|relocation' "$plain" | head -n 40)
        if [ -z "$matches" ]; then
          echo "::error title=Kernel::no error line matched, tail follows"
          tail -n 40 "$plain" | while IFS= read -r line; do
            echo "::error title=Kernel-tail::${line}"
          done
          exit 0
        fi
        printf '%s\n' "$matches" | while IFS= read -r line; do
          echo "::error title=Kernel::${line}"
        done
        exit 0

    - name: Build nomount.ko
      run: |
        echo "=== Building NoMount for KMI: ${{ inputs.kmi }} ==="
        # The checkout lives at $GITHUB_WORKSPACE; /github/workspace is only the
        # scratch directory the kernelsu.ko step creates for its artifacts.
        NOMOUNT_OUT="/github/workspace/out/aarch64/${{ inputs.kmi }}_nomount.ko" \
          sh "$GITHUB_WORKSPACE/userspace/nomount/build-lkm.sh"
        echo "Size: $(du -h "/github/workspace/out/aarch64/${{ inputs.kmi }}_nomount.ko" | cut -f1)"

    - name: Upload kernelsu.ko artifact
      uses: actions/upload-artifact@v7
      with:
        name: aarch64-${{ inputs.kmi }}-lkm
        path: |
          /github/workspace/out/aarch64/${{ inputs.kmi }}_kernelsu.ko
          /github/workspace/out/aarch64/${{ inputs.kmi }}_nomount.ko


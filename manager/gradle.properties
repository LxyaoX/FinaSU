android.experimental.enableNewResourceShrinker.preciseShrinking=true
android.enableAppCompileTimeRClass=true
android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true
org.gradle.tooling.parallel=true
org.gradle.vfs.watch=true
android.r8.maxWorkers=4
android.native.buildOutput=verbose

# Version name used when the clone carries no reachable tag (see build.gradle.kts).
# Tagging v* still takes precedence. Bump this when cutting a release without tags.
managerFallbackVersion=v1.0.0

android.experimental.enableNewResourceShrinker.preciseShrinking=true
android.enableAppCompileTimeRClass=true
android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true
# Task outputs are reused across runs: the CI checkout starts empty, so the local build
# cache is the only way a second build can skip work the first one already did.
org.gradle.caching=true
org.gradle.tooling.parallel=true
org.gradle.vfs.watch=true
android.r8.maxWorkers=4
android.native.buildOutput=verbose

# Base version for the `v<base>-<commits>-g<hash>` name used when no tag is reachable.
# A reachable v* tag takes precedence, so this only matters while the clone has no tags.
managerBaseVersion=v3.3.4
